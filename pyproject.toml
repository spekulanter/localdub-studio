[project]
name = "localdub"
version = "0.5.0"
description = "LocalDub Studio - local-first English-to-Slovak video dubbing"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.4",
    "nvidia-cublas-cu12==12.9.2.10; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12==9.27.0.42; sys_platform == 'win32' or sys_platform == 'linux'",
    "supertonic==1.3.1",
    "huggingface-hub>=0.30,<3",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.2",
    "numpy>=2.0,<2.6",
    "soundfile==0.14.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "sherpa-onnx==2.0.1",
    "pywebview==6.2.1",
    # Apple Silicon: Whisper on the GPU through Apple's MLX (faster-whisper has no Metal backend).
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
# Optional, experimental: dialogue/background separation and voice conversion. PyTorch is large
# (about 3 GB with CUDA), so it is not part of the default install: `uv sync --extra experimental`.
experimental = [
    "demucs==4.1.0",
    "torch==2.9.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "mypy==2.4.1",
]

[project.scripts]
localdub-m0 = "localdub.cli:main"
localdub = "localdub.cli:main"

[project.gui-scripts]
localdub-app = "localdub.desktop:main"

[tool.uv]
# Windows (NVIDIA) and Apple Silicon Macs. Linux and Intel Macs are not supported.
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "experimental", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["localdub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA GPU with faster-whisper",
    "ollama: requires a running Ollama server",
    "models: requires downloaded model weights",
]

[tool.ruff]
line-length = 100
extend-exclude = ["localdub/vendor"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S603", "S604"]

[tool.mypy]
exclude = ["localdub/vendor/"]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "S603", "E741"]
