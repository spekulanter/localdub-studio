name: Build installer

# Manual runs build and test the installer and keep it as a workflow artifact.
# Pushing a tag like v0.1.0 also publishes it as a GitHub pre-release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # only used to create the release on tags

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: The changelog has a section for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          if ($text -notmatch "(?m)^## \[$([regex]::Escape($ver))\]") { throw "CHANGELOG.md has no '## [$ver]' section" }
          $py = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($py -ne $ver) { throw "pyproject.toml says version $py but the tag is v$ver" }

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Tools (uv, FFmpeg, Inno Setup)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.23
          choco install ffmpeg innosetup -y --no-progress
          uv --version

      - name: Python checks
        shell: pwsh
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run mypy localdub
          uv run pytest -q

      - name: Frontend
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test

      - name: Build installer and ZIP
        shell: pwsh
        run: uv run python packaging/build_release.py --skip-frontend

      - name: Smoke test - silent install, start the server, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter 'LocalDub-Studio-*-Setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'The installer was not built' }
          $dir = Join-Path $env:ProgramFiles 'LocalDub Studio'   # the default install folder
          $p = Start-Process -FilePath $setup.FullName -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-',             '/COMPONENTS=core', '/TASKS=!desktopicon', '/LOG=C:\ld-setup.log')
          $deadline = (Get-Date).AddMinutes(20)
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 30
            Write-Host "[$(Get-Date -Format T)] installer still running; install.log tail:"
            if (Test-Path "$dir\install.log") { Get-Content "$dir\install.log" -Tail 3 }
          }
          if (-not $p.HasExited) {
            Get-Content C:\ld-setup.log -Tail 40 -ErrorAction SilentlyContinue
            Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'uv|python|cmd|winget|Setup|setup|tmp' } | Select-Object ProcessId, ParentProcessId, Name, CommandLine | Format-List | Out-Host
            Stop-Process -Id $p.Id -Force
            throw 'The installer did not finish within 20 minutes'
          }
          Get-Content C:\ld-setup.log -Tail 30
          if ($p.ExitCode -ne 0) { throw "Installer exit code $($p.ExitCode)" }
          foreach ($f in '.venv\Scripts\localdub-app.exe', '.venv\Scripts\python.exe', 'python', '.installed', 'frontend\dist\index.html', 'tools\uv.exe', 'docs\LICENSES.md') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "Missing after install: $f" }
          }
          & "$dir\.venv\Scripts\python.exe" -c "import localdub, fastapi, webview, sherpa_onnx; print('imports ok')"
          $srv = Start-Process -FilePath "$dir\.venv\Scripts\localdub.exe" -ArgumentList 'serve' -PassThru -WindowStyle Hidden -WorkingDirectory $dir
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try { $ok = (Invoke-WebRequest 'http://127.0.0.1:8765/api/options' -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200 } catch {}
          }
          if (-not $ok) { throw 'The installed server did not start' }
          $page = Invoke-WebRequest 'http://127.0.0.1:8765/' -UseBasicParsing
          if ($page.Content -notmatch 'LocalDub Studio') { throw 'The web UI is not served' }
          Stop-Process -Id $srv.Id -Force
          $userData = Join-Path $env:LOCALAPPDATA 'LocalDub Studio\data'
          if (-not (Test-Path (Join-Path $userData 'localdub.sqlite'))) { throw "User data is not in $userData" }
          if (Test-Path (Join-Path $dir 'data')) { throw 'The program wrote user data into its install folder' }
          # Upgrade paths: run the same installer over the existing installation.
          function Run-Setup($mode) {
            $a = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/COMPONENTS=core', '/TASKS=!desktopicon', "/MODE=$mode", "/LOG=C:\ld-setup-$mode.log")
            $s = Start-Process -FilePath $setup.FullName -PassThru -Wait -ArgumentList $a
            Get-Content "C:\ld-setup-$mode.log" -Tail 12
            if ($s.ExitCode -ne 0) { throw "Installer ($mode) exit code $($s.ExitCode)" }
            foreach ($f in '.venv\Scripts\localdub-app.exe', '.venv\Scripts\python.exe', '.installed', 'frontend\dist\index.html', 'unins000.exe') {
              if (-not (Test-Path (Join-Path $dir $f))) { throw "Missing after $mode : $f" }
            }
            & "$dir\.venv\Scripts\python.exe" -c "import localdub, fastapi; print('imports ok after $mode')"
          }
          $keep = Join-Path $userData 'upgrade-marker.txt'
          'projects and settings live here' | Set-Content $keep
          Set-Content (Join-Path $dir 'localdub\stale-from-old-version.py') 'x'
          Run-Setup 'update'
          if (Test-Path (Join-Path $dir 'localdub\stale-from-old-version.py')) { throw 'A file of the old version survived the update' }
          if (-not (Test-Path $keep)) { throw 'The update removed user data' }
          Run-Setup 'fresh'
          if (-not (Test-Path $keep)) { throw 'Remove-and-install removed user data' }
          if (-not (Test-Path (Join-Path $userData 'localdub.sqlite'))) { throw 'The database is gone after remove-and-install' }
          $u = Start-Process -FilePath "$dir\unins000.exe" -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($u.ExitCode -ne 0) { throw "Uninstaller exit code $($u.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\.venv") { throw 'The uninstaller left the virtual environment behind' }
          if (Test-Path "$dir\python") { throw 'The uninstaller left the bundled Python behind' }
          Write-Host 'Install, start and uninstall OK'

      - uses: actions/upload-artifact@v7
        with:
          name: LocalDub-Studio-windows
          path: release/*
          if-no-files-found: error

  macos:
    # Apple Silicon (M1 and newer). The runner has no GPU, so only the parts that do not need one are
    # exercised; what was and was not checked is written in docs/INSTALL-macOS.md.
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Tools (uv, FFmpeg for the tests)
        run: |
          python3 -m venv "$RUNNER_TEMP/uvenv"
          "$RUNNER_TEMP/uvenv/bin/pip" install --disable-pip-version-check uv==0.12.23
          echo "$RUNNER_TEMP/uvenv/bin" >> "$GITHUB_PATH"
          brew install ffmpeg
          "$RUNNER_TEMP/uvenv/bin/uv" --version

      - name: Python checks
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run mypy localdub
          uv run pytest -q

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build the app and the disk image
        run: uv run python packaging/build_macos.py --skip-frontend

      - name: Install the app from the disk image (as a user would)
        run: |
          dmg=$(ls release/LocalDub-Studio-*-macOS-arm64.dmg)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint /Volumes/LocalDubTest
          ls -la /Volumes/LocalDubTest
          ditto "/Volumes/LocalDubTest/LocalDub Studio.app" "/Applications/LocalDub Studio.app"
          hdiutil detach /Volumes/LocalDubTest
          # what a download from a browser gets: Gatekeeper's quarantine flag
          xattr -w com.apple.quarantine "0083;5f5e1000;Safari;" "/Applications/LocalDub Studio.app"
          codesign --verify --deep --strict "/Applications/LocalDub Studio.app" && echo "signature seals"
          du -sh "/Applications/LocalDub Studio.app"

      - name: The app's own Python imports everything, finds Apple Silicon and the Mac catalogue
        run: |
          APP="/Applications/LocalDub Studio.app/Contents/Resources"
          cd "$RUNNER_TEMP"
          PYTHONPATH="$APP/app" PYTHONNOUSERSITE=1 "$APP/python/bin/python3" "$GITHUB_WORKSPACE/packaging/smoke_macos.py" imports

      - name: Download the pinned FFmpeg, yt-dlp and Deno for real, and run them
        run: |
          APP="/Applications/LocalDub Studio.app/Contents/Resources"
          cd "$RUNNER_TEMP"
          export PYTHONPATH="$APP/app" PYTHONNOUSERSITE=1
          "$APP/python/bin/python3" "$GITHUB_WORKSPACE/packaging/smoke_macos.py" ffmpeg
          "$APP/python/bin/python3" "$GITHUB_WORKSPACE/packaging/smoke_macos.py" youtube

      - name: The optional Demucs packages can be planned from the app's lock file
        run: |
          APP="/Applications/LocalDub Studio.app/Contents/Resources"
          cd "$RUNNER_TEMP"
          PYTHONPATH="$APP/app" PYTHONNOUSERSITE=1 "$APP/python/bin/python3" "$GITHUB_WORKSPACE/packaging/smoke_macos.py" extras

      - name: The server starts from the installed app and serves the interface
        run: |
          APP="/Applications/LocalDub Studio.app/Contents/Resources"
          cd "$RUNNER_TEMP"
          export PYTHONPATH="$APP/app" PYTHONNOUSERSITE=1
          "$APP/python/bin/python3" -m localdub.cli serve > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8765/api/ping > /dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then cat "$RUNNER_TEMP/server.log"; kill $pid; exit 1; fi
          curl -fsS http://127.0.0.1:8765/ | grep -q "LocalDub Studio"
          curl -fsS "http://127.0.0.1:8765/api/options" | python3 -c "
          import json, sys
          o = json.load(sys.stdin)
          ids = [c['id'] for c in o['asr_choices']]
          print('speech models offered:', ids)
          assert o['default_asr'] == 'whisper-large-v3-mlx', o['default_asr']
          assert 'whisper-large-v3' not in ids
          "
          curl -fsS "http://127.0.0.1:8765/api/models" | python3 -c "
          import json, sys
          m = json.load(sys.stdin)
          rows = {r['id']: r for r in m['models']}
          print('hardware:', m['hardware'])
          assert m['hardware']['gpu']['unified'] is True
          assert 'ffmpeg' in rows and rows['ffmpeg']['required']
          print('still to download:', m['required_missing'])
          "
          kill $pid
          test -f "$HOME/Library/Application Support/LocalDub Studio/data/localdub.sqlite"
          test ! -e "/Applications/LocalDub Studio.app/Contents/Resources/app/data"
          echo "user data is in Application Support, not in the app"

      - name: Open the app like a user (window, Dock). Not every runner has a screen.
        continue-on-error: true
        run: |
          xattr -dr com.apple.quarantine "/Applications/LocalDub Studio.app"  # a user clicks "Open Anyway"
          open -n -a "/Applications/LocalDub Studio.app"
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8765/api/ping > /dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          sleep 15
          echo "--- launch.log"; cat "$HOME/Library/Logs/LocalDub Studio/launch.log" || true
          echo "--- app.log"; cat "$HOME/Library/Application Support/LocalDub Studio/data/logs/app.log" || true
          pkill -f "localdub.desktop" || true
          test "$ok" = 1
          grep -q "Window loaded" "$HOME/Library/Application Support/LocalDub Studio/data/logs/app.log"

      - name: Whisper (MLX) transcribes a spoken sentence on the processor. The runner has no GPU.
        continue-on-error: true
        run: |
          APP="/Applications/LocalDub Studio.app/Contents/Resources"
          cd "$RUNNER_TEMP"
          PYTHONPATH="$APP/app" PYTHONNOUSERSITE=1 "$APP/python/bin/python3" "$GITHUB_WORKSPACE/packaging/smoke_macos.py" asr

      - uses: actions/upload-artifact@v7
        with:
          name: LocalDub-Studio-macos
          path: release/*
          if-no-files-found: error

  release:
    # Windows decides whether there is a release; the Mac build is added when it succeeded.
    if: startsWith(github.ref, 'refs/tags/v') && always() && needs.windows.result == 'success'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: LocalDub-Studio-*
          path: release
          merge-multiple: true

      - name: Publish pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($ver))\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no section for $ver" }
          $footer = @'

          ---
          **Windows**: the installer is unsigned, so Windows SmartScreen will warn (More info, then Run anyway). Compare
          the download with the `.sha256` file. Needs Windows 10/11 64-bit; an NVIDIA GPU with 8 GB or more is
          recommended. Setup installs the program and its Python libraries (about 2.5 GB). The AI models (about
          6.7 GB) are downloaded inside the app on first start. See docs/INSTALL.md and docs/QUALITY.md.
          '@
          $files = Get-ChildItem release -File | Sort-Object Name | ForEach-Object { $_.FullName }
          if ($files | Where-Object { $_ -like '*.dmg' }) {
            $footer += @'

          **macOS (Apple Silicon)**: `LocalDub-Studio-*-macOS-arm64.dmg`. Unsigned, so the first start needs a
          right-click, Open (see docs/INSTALL-macOS.md). **Experimental**: the Mac version was built and checked
          by an automated runner without a GPU and has not been used on a real Mac yet; speed and quality there
          are unmeasured.
          '@
          }
          Set-Content -Path release-notes.md -Value ($m.Groups[1].Value.Trim() + "`n" + $footer) -Encoding UTF8
          gh release create $env:GITHUB_REF_NAME @files `
            --title "LocalDub Studio $env:GITHUB_REF_NAME" --notes-file release-notes.md --prerelease
